{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Create your account</h2>
  <form id="signup-form" method="POST" action="{{ url_for('signup') }}" novalidate>
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6">

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
    <span class="field-hint" id="password-hint"></span>

    <fieldset class="role-select">
      <legend>I am a</legend>
      <label class="role-option">
        <input type="radio" name="role" value="freelancer" {% if preselected_role == 'freelancer' %}checked{% endif %}>
        Freelancer, looking for work
      </label>
      <label class="role-option">
        <input type="radio" name="role" value="client" {% if preselected_role == 'client' %}checked{% endif %}>
        Client, looking to hire
      </label>
    </fieldset>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
