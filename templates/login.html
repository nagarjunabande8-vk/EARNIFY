{% extends "base.html" %}

{% block title %}Log In — Earnify{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Log in to manage your freelance projects and applications</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="name@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <div class="form-actions">
        <label class="form-check">
          <input type="checkbox" name="remember" id="remember">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="{{ url_for('signup') }}"><strong>Sign up here</strong></a>
    </div>
  </div>
</div>
{% endblock %}
